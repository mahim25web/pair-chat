<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PairChat — Private Messenger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='52'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">

<script type="module" src="/script.js"></script>

<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- JOIN -->
<div id="join">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">💬</div>
      <h1>PairChat</h1>
      <p>Private messenger — just two people</p>
      <div class="pill">🔒 2 people per room only</div>
    </div>

    <div class="fields">
      <div class="f">
        <label>Room ID</label>
        <input id="ri" type="text" placeholder="e.g. MAHIM-77" maxlength="24"
               oninput="this.value=this.value.toUpperCase()"
               onkeydown="if(event.key==='Enter')document.getElementById('ui').focus()">
        <div class="hint">📎 Share this ID with your partner</div>
      </div>

      <div class="sep"></div>

      <div class="f">
        <label>Your User ID</label>
        <input id="ui" type="text" placeholder="Unique ID, e.g. mahim01" maxlength="30"
               onkeydown="if(event.key==='Enter')document.getElementById('ni').focus()">
      </div>

      <div class="f">
        <label>Display Name <span style="color:var(--sub);font-weight:300;text-transform:none">(optional)</span></label>
        <input id="ni" type="text" placeholder="Name shown in chat" maxlength="30"
               onkeydown="if(event.key==='Enter')doJoin()">
      </div>
    </div>

    <button id="jb" onclick="doJoin()">Enter Chat Room →</button>
    <div id="errmsg"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="hdr">
    <div class="hdr-icon">💬</div>
    <div class="hdr-info">
      <div class="hdr-title">PairChat</div>
      <div class="hdr-sub">
        <div class="dot off" id="dot"></div>
        <span id="who">Waiting for partner…</span>
      </div>
    </div>
    <div class="rtag" id="roomtag">#ROOM</div>
    <button id="nb" onclick="doNotif()">🔕 Notify</button>
  </div>

  <div id="msgs">
    <div class="empty-state">
      <span class="big">👋</span>
      Share your Room ID with your partner<br>and start chatting!
    </div>
  </div>

  <div class="inp-wrap">
    <div class="mytag">You: <b id="myname"></b></div>
    <div class="inp-row">
      <textarea id="inp" placeholder="Type a message… (Enter to send)"
                onkeydown="keydown(event)"
                oninput="resize(this)"
                rows="1"></textarea>
      <button id="sb" onclick="doSend()" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

</body>
</html>
